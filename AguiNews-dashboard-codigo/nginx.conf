# Sitio Angular y la ápi (solo lectura) en el mismo dominio.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # La ápi se publica solo para leer; se llama por su nombre en la red de Docker.
  location /api/ {
    limit_except GET { deny all; }
    proxy_pass http://api:8080;
  }

  # Rutas de Angular: siempre index.html, sin caché para recibir cada versión nueva.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
